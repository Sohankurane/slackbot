<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Slackbot Admin</title>
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-body auth-body-alt">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">✨</div>
      <div class="auth-brand">Create Account</div>
      <p class="auth-subtitle">Join Slackbot Admin</p>

      {% if error %}
        <div class="auth-error">⚠️ {{ error }}</div>
      {% endif %}

      <form method="POST" action="/admin/register" class="auth-form">
        <div class="auth-field">
          <label>Username</label>
          <input
            type="text"
            name="username"
            required
            autofocus
            minlength="3"
            maxlength="64"
            autocomplete="username"
            placeholder="Choose a username"
            value="{{ values.username or '' }}">
          <small class="auth-hint">At least 3 characters</small>
        </div>

        <div class="auth-field">
          <label>Password</label>
          <input
            type="password"
            name="password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="Create a password">
          <small class="auth-hint">At least 6 characters</small>
        </div>

        <div class="auth-field">
          <label>Confirm Password</label>
          <input
            type="password"
            name="confirm_password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="Re-enter password">
        </div>

        <button type="submit" class="auth-button">Create Account →</button>
      </form>

      <div class="auth-divider"><span>already have an account?</span></div>

      <a href="/admin/login" class="auth-link-button">Sign in instead</a>

      <div class="auth-footer">
        Multi-tenant Slack Bot Platform
      </div>
    </div>
  </div>
</body>
</html>
