<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Slackbot Admin</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🤖</div>
      <div class="auth-brand">Slackbot Admin</div>
      <p class="auth-subtitle">Sign in to continue</p>

      {% if error %}
        <div class="auth-error">⚠️ {{ error }}</div>
      {% endif %}

      <form method="POST" action="/admin/login" class="auth-form">
        <div class="auth-field">
          <label>Username</label>
          <input type="text" name="username" required autofocus autocomplete="username" placeholder="admin">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="auth-button">Sign in →</button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <a href="/admin/register" class="auth-link-button">Create an account</a>

      <div class="auth-footer">
        Multi-tenant Slack Bot Platform
      </div>
    </div>
  </div>
</body>
</html>
