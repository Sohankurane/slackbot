<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Slackbot Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="8" width="14" height="11" rx="3"/>
          <path d="M12 8V4M12 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
          <path d="M9 13h.01M15 13h.01"/>
          <path d="M2 13v3M22 13v3"/>
        </svg>
      </div>
      <div class="auth-brand">Slackbot Admin</div>
      <p class="auth-subtitle">Sign in to continue</p>

      {% if error %}
        <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/admin/login" class="auth-form">
        <div class="auth-field">
          <label>Username</label>
          <input type="text" name="username" required autofocus autocomplete="username" placeholder="admin">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="auth-button">Sign in</button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <a href="/admin/register" class="auth-link-button">Create an account</a>

      <div class="auth-footer">
        Multi-tenant Slack Bot Platform
      </div>
    </div>
  </div>
</body>
</html>
