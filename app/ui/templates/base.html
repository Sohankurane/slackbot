<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Slackbot Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav>
    <div class="nav-brand">🤖 Slackbot Admin</div>
    <div class="nav-links">
      <a href="/admin">Dashboard</a>
      <a href="/admin/manage">Manage</a><a href="/admin/templates">Templates</a>
      <a href="/admin/compose?tenant=prj-sk">Compose</a>
      {% if request.session.get('admin_username') %}
        <span class="nav-user">👤 {{ request.session.get('admin_username') }}</span>
        <form method="POST" action="/admin/logout" style="display:inline;">
          <button type="submit" class="nav-logout">Logout</button>
        </form>
      {% endif %}
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
