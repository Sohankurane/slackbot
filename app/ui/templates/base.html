<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Top navigation bar -->
  <header class="topnav">
    <div class="topnav-inner">
      <div class="topnav-left">
        <a href="/admin" class="topnav-brand">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>
          <span>Slackbot</span>
        </a>
        <nav class="topnav-links">
          <a href="/admin" class="topnav-link {% if request.url.path == '/admin' %}active{% endif %}">Dashboard</a>
          <a href="/admin/manage" class="topnav-link {% if '/admin/manage' in request.url.path %}active{% endif %}">Tenants &amp; Bots</a>
          <a href="/admin/templates" class="topnav-link {% if '/admin/templates' in request.url.path %}active{% endif %}">Templates</a>
          <a href="/admin/compose?tenant=prj-sk" class="topnav-link {% if '/admin/compose' in request.url.path %}active{% endif %}">Compose</a>
        </nav>
      </div>
      <div class="topnav-right">
        {% set username = request.session.get('admin_username', 'admin') %}
        <div class="topnav-user">
          <div class="topnav-avatar">{{ username[0]|upper }}</div>
          <span class="topnav-username">{{ username }}</span>
        </div>
        <form method="POST" action="/admin/logout">
          <button type="submit" class="topnav-logout" title="Sign out">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </form>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>

  <div class="toast-container" id="toasts"></div>

  <!-- Shared confirm modal -->
<div class="cmodal-backdrop" id="confirmModal">
  <div class="cmodal" onclick="event.stopPropagation()">
    <div class="cmodal-icon" id="confirmIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div class="cmodal-title" id="confirmTitle">Are you sure?</div>
    <div class="cmodal-message" id="confirmMessage"></div>
    <div class="cmodal-actions">
      <button class="cmodal-btn cmodal-cancel" id="confirmCancel">Cancel</button>
      <button class="cmodal-btn cmodal-confirm" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

  <script>
    window.toast = function(message, type) {
      const el = document.createElement('div');
      el.className = 'toast toast-' + (type || 'info');
      el.textContent = message;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 200ms'; setTimeout(()=>el.remove(),200); }, 3500);
    };
    window.openModal = (id) => document.getElementById(id).classList.add('open');
    window.closeModal = (id) => document.getElementById(id).classList.remove('open');
    document.addEventListener('click', (e) => { if (e.target.classList.contains('modal-backdrop')) e.target.classList.remove('open'); });
    window.api = async function(method, url, body) {
      const opts = { method, credentials: 'same-origin', headers: {} };
      if (body) { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
      const res = await fetch(url, opts);
      let data = null; try { data = await res.json(); } catch {}
      return { ok: res.ok, status: res.status, data };
    };
    // Promise-based confirm modal — replaces native confirm()
    window.confirmAction = function(message, opts) {
      opts = opts || {};
      return new Promise((resolve) => {
        const backdrop = document.getElementById('confirmModal');
        const titleEl = document.getElementById('confirmTitle');
        const msgEl = document.getElementById('confirmMessage');
        const okBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');

        titleEl.textContent = opts.title || 'Are you sure?';
        msgEl.textContent = message || '';
        okBtn.textContent = opts.confirmText || 'Confirm';

        // danger styling toggle
        okBtn.classList.toggle('danger', opts.danger !== false);

        backdrop.classList.add('open');

        function cleanup() {
          backdrop.classList.remove('open');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          backdrop.removeEventListener('click', onBackdrop);
        }
        function onOk()     { cleanup(); resolve(true); }
        function onCancel() { cleanup(); resolve(false); }
        function onBackdrop(e) { if (e.target === backdrop) { cleanup(); resolve(false); } }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        backdrop.addEventListener('click', onBackdrop);
      });
    };
    // Render skeleton rows into a tbody while data loads
    window.renderSkeletonRows = function(tbody, cols, rows) {
      rows = rows || 5;
      const widths = ['sk-text', 'sk-short', 'sk-long', 'sk-text'];
      let html = '';
      for (let r = 0; r < rows; r++) {
        html += '<tr class="sk-row">';
        for (let c = 0; c < cols; c++) {
          if (c === 0) {
            // First column: avatar + text combo
            html += '<td><div class="sk-cell-flex"><span class="skeleton sk-circle"></span><span class="skeleton sk-text"></span></div></td>';
          } else if (c === cols - 1) {
            html += '<td><span class="skeleton sk-btn"></span></td>';
          } else {
            html += '<td><span class="skeleton ' + widths[c % widths.length] + '"></span></td>';
          }
        }
        html += '</tr>';
      }
      tbody.innerHTML = html;
    };
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
