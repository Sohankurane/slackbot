{% extends "base.html" %}
{% block title %}Compose Message{% endblock %}
{% block content %}
<h1>Compose Message</h1>
<p>Tenant: <strong>{{ tenant }}</strong></p>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('alert')">🚨 Alert</button>
  <button class="tab-btn" onclick="showTab('qa')">❓ Q&A</button>
  <button class="tab-btn" onclick="showTab('mcq')">📋 MCQ</button>
</div>

<!-- Alert -->
<div id="tab-alert" class="tab-content active">
  <div class="card">
    <h2>Send Alert</h2>
    <div class="field">
      <label>Bot</label>
      <select id="alert-bot">
        {% for bot in bots %}
        <option value="{{ bot.slug }}">{{ bot.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Channel ID</label>
      <input type="text" id="alert-channel" placeholder="C0XXXXXXX or D0XXXXXXX">
    </div>
    <div class="field">
      <label>Level</label>
      <select id="alert-level">
        <option value="info">ℹ️ Info</option>
        <option value="warning">⚠️ Warning</option>
        <option value="critical">🚨 Critical</option>
      </select>
    </div>
    <div class="field">
      <label>Message</label>
      <textarea id="alert-message" rows="3" placeholder="Your alert message..."></textarea>
    </div>
    <button class="btn-primary" onclick="sendAlert()">Send Alert</button>
    <div id="alert-result" class="result"></div>
  </div>
</div>

<!-- Q&A -->
<div id="tab-qa" class="tab-content">
  <div class="card">
    <h2>Send Question (Free Text)</h2>
    <div class="field">
      <label>Bot</label>
      <select id="qa-bot">
        {% for bot in bots %}
        <option value="{{ bot.slug }}">{{ bot.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Channel ID</label>
      <input type="text" id="qa-channel" placeholder="C0XXXXXXX">
    </div>
    <div class="field">
      <label>Question</label>
      <textarea id="qa-question" rows="3" placeholder="What is your question?"></textarea>
    </div>
    <button class="btn-primary" onclick="sendQA()">Send Question</button>
    <div id="qa-result" class="result"></div>
  </div>
</div>

<!-- MCQ -->
<div id="tab-mcq" class="tab-content">
  <div class="card">
    <h2>Send MCQ</h2>
    <div class="field">
      <label>Bot</label>
      <select id="mcq-bot">
        {% for bot in bots %}
        <option value="{{ bot.slug }}">{{ bot.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Channel ID</label>
      <input type="text" id="mcq-channel" placeholder="C0XXXXXXX">
    </div>
    <div class="field">
      <label>Question</label>
      <textarea id="mcq-question" rows="2" placeholder="Your question?"></textarea>
    </div>
    <div class="field">
      <label>Options (one per line, min 2)</label>
      <textarea id="mcq-options" rows="4" placeholder="Option A&#10;Option B&#10;Option C"></textarea>
    </div>
    <button class="btn-primary" onclick="sendMCQ()">Send MCQ</button>
    <div id="mcq-result" class="result"></div>
  </div>
</div>

<script>
const TENANT = "{{ tenant }}";
const ADMIN_TOKEN = prompt("Enter admin token:") || "";

function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Admin-Token': ADMIN_TOKEN,
    },
    body: JSON.stringify(body),
  });
  return res.json();
}

function showResult(id, data) {
  const el = document.getElementById(id);
  el.textContent = data.ok ? '✅ Sent!' : '❌ Error: ' + JSON.stringify(data);
  el.className = 'result ' + (data.ok ? 'success' : 'error');
}

async function sendAlert() {
  const data = await post(`/api/admin/send/alert?tenant_slug=${TENANT}`, {
    bot_slug: document.getElementById('alert-bot').value,
    channel: document.getElementById('alert-channel').value,
    message: document.getElementById('alert-message').value,
    level: document.getElementById('alert-level').value,
  });
  showResult('alert-result', data);
}

async function sendQA() {
  const data = await post(`/api/admin/send/qa?tenant_slug=${TENANT}`, {
    bot_slug: document.getElementById('qa-bot').value,
    channel: document.getElementById('qa-channel').value,
    question: document.getElementById('qa-question').value,
  });
  showResult('qa-result', data);
}

async function sendMCQ() {
  const options = document.getElementById('mcq-options').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const data = await post(`/api/admin/send/mcq?tenant_slug=${TENANT}`, {
    bot_slug: document.getElementById('mcq-bot').value,
    channel: document.getElementById('mcq-channel').value,
    question: document.getElementById('mcq-question').value,
    options,
  });
  showResult('mcq-result', data);
}
</script>
{% endblock %}
